# ZIPRAF OMEGA - Exemplo de Integração com GitHub Actions
# =======================================================
# 
# Este arquivo mostra como integrar o Zipraf Omega em workflows do GitHub Actions
# para automatizar a assinatura de APKs.
#
# IMPORTANTE: Este é apenas um EXEMPLO. Não está ativo no repositório.
# Para ativar, renomeie para um nome sem .example (ex: zipraf-omega-sign.yml)

name: Zipraf Omega - Auto Sign APK (EXAMPLE)

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'app/**'

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔽 Checkout repository
      uses: actions/checkout@v4
      
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 📦 Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 🔧 Setup Zipraf Omega
      run: |
        cd zipraf_omega
        pip install -r requirements.txt
        
    - name: ⚙️ Configure Zipraf Omega
      env:
        GITHUB_PAT: ${{ secrets.OMEGA_GITHUB_PAT }}
        KEYSTORE_BASE64: ${{ secrets.OMEGA_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.OMEGA_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.OMEGA_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.OMEGA_KEY_PASSWORD }}
        MASTER_PASSWORD: ${{ secrets.OMEGA_MASTER_PASSWORD }}
      run: |
        cd zipraf_omega
        
        # Decodificar keystore do base64
        echo "$KEYSTORE_BASE64" | base64 -d > ../release.jks
        
        # Configurar via script Python
        python3 << 'EOF'
        from omega_manager import ZipRafOmegaManager
        import os
        
        manager = ZipRafOmegaManager()
        
        # Obter variáveis de ambiente
        master_pwd = os.environ.get('MASTER_PASSWORD')
        github_pat = os.environ.get('GITHUB_PAT')
        keystore_pwd = os.environ.get('KEYSTORE_PASSWORD')
        key_pwd = os.environ.get('KEY_PASSWORD')
        key_alias = os.environ.get('KEY_ALIAS')
        
        # Configurar
        manager.set_config('master_password_hash', 
                          __import__('hashlib').sha256(master_pwd.encode()).hexdigest())
        manager.set_config('github_pat', github_pat, encrypt=True, password=master_pwd)
        manager.set_config('keystore_file', '../release.jks')
        manager.set_config('key_alias', key_alias)
        manager.set_config('keystore_password', keystore_pwd, encrypt=True, password=master_pwd)
        manager.set_config('key_password', key_pwd, encrypt=True, password=master_pwd)
        manager.set_config('repo_owner', 'rafaelmeloreisnovo')
        manager.set_config('repo_name', 'UserLAnd')
        
        print("✓ Configuração concluída")
        EOF
        
    - name: 🏗️ Build APK
      run: |
        ./gradlew assembleRelease
        
    - name: 🔒 Sign APK with Zipraf Omega
      env:
        MASTER_PASSWORD: ${{ secrets.OMEGA_MASTER_PASSWORD }}
      run: |
        cd zipraf_omega
        
        # Assinar usando Omega Manager
        python3 << EOF
        from omega_manager import ZipRafOmegaManager
        import os
        import sys
        
        manager = ZipRafOmegaManager()
        master_pwd = os.environ.get('MASTER_PASSWORD')
        
        # Simular entrada da senha mestra (em CI, não é interativo)
        class FakeMasterPassword:
            def __init__(self, pwd):
                self.pwd = pwd
            def __call__(self, prompt):
                return self.pwd
        
        import getpass
        getpass.getpass = FakeMasterPassword(master_pwd)
        
        # Assinar APK
        apk_path = '../app/build/outputs/apk/release/app-release-unsigned.apk'
        output_path = '../app/build/outputs/apk/release/app-release-signed.apk'
        
        success = manager.sign_apk(apk_path, output_path)
        
        if not success:
            print("✗ Falha ao assinar APK")
            sys.exit(1)
        
        print("✓ APK assinado com sucesso")
        EOF
        
    - name: 📤 Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-apk
        path: app/build/outputs/apk/release/app-release-signed.apk
        if-no-files-found: error
        
    - name: 📊 Show Zipraf Omega Status
      run: |
        cd zipraf_omega
        python3 omega_manager.py --status
        
    - name: 📋 Show Signing Logs
      if: always()
      run: |
        cd zipraf_omega
        python3 omega_manager.py --logs --log-limit 10

# CONFIGURAÇÃO DE SECRETS NECESSÁRIOS:
# ====================================
# 
# Adicione os seguintes secrets no GitHub (Settings > Secrets > Actions):
#
# 1. OMEGA_GITHUB_PAT
#    - Seu GitHub Personal Access Token
#    - Permissões: repo, workflow, write:packages
#
# 2. OMEGA_KEYSTORE_BASE64
#    - Seu keystore codificado em base64
#    - Obtenha com: base64 -w 0 release.jks
#
# 3. OMEGA_KEYSTORE_PASSWORD
#    - Senha do keystore
#
# 4. OMEGA_KEY_ALIAS
#    - Alias da chave no keystore
#
# 5. OMEGA_KEY_PASSWORD
#    - Senha da chave
#
# 6. OMEGA_MASTER_PASSWORD
#    - Senha mestra para criptografia do Omega
#    - Use uma senha forte e única
#
# NOTAS DE SEGURANÇA:
# ==================
# - Nunca exponha secrets em logs
# - Use sempre secrets do GitHub para credenciais
# - Revogue PATs após migração ou vazamento
# - Mantenha keystores seguros e backupeados
