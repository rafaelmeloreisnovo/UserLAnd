# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Enable Gradle caching for faster builds
org.gradle.caching=true

# Enable Gradle daemon for faster builds (enabled by default)
org.gradle.daemon=true

# Configure build cache directory (optional)
# org.gradle.cache.dir=/path/to/cache

# Enable configuration cache (Gradle 8.7+) for faster configuration phase
# checkIfAssetsMissing was the blocker (config-time file I/O) — now replaced
# by inputs/outputs declarations on fetchAssets (execution-time, cache-safe)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Kotlin code compilation optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true

# Android-specific optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# R8 optimizations for release builds
android.enableR8.fullMode=true

# Pin the NDK so native builds (C helpers, terminal emulator) use a predictable
# toolchain across CI and local environments. Override with -PndkVersion if a
# newer tested release is required.
ndkVersion=27.3.13750724
