# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

android.useAndroidX=true
# Pin the NDK so native builds (C helpers, terminal emulator) use a predictable
# toolchain across CI and local environments. Override with -PndkVersion if a
# newer tested release is required.
ndkVersion=21.4.7075529
