apply plugin: 'com.android.library'

android {
    namespace 'com.termux.terminal.term'
    compileSdk 35
    defaultConfig {
        minSdk 21
        targetSdk 35
    }

    buildTypes {
        beta {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'MissingLeanbackLauncher'
    }
}

dependencies {
    implementation "androidx.annotation:annotation:${rootProject.ext.androidx_annotation_version}"
    // Use core 1.17.0 for compatibility with AGP 8.6.0 and compileSdk 35
    implementation "androidx.core:core:${rootProject.ext.androidx_core_version}"
    implementation "androidx.drawerlayout:drawerlayout:${rootProject.ext.androidx_drawerlayout_version}"
    implementation "androidx.viewpager:viewpager:${rootProject.ext.androidx_viewpager_version}"
    implementation project(":terminal-view")
    testImplementation 'junit:junit:4.13.2'
}

// Compile the native raf_* helpers and package them into the APK assets so they
// are always available in Termux sessions bundled with the app.
def packageStaticBins = tasks.register("packageStaticBins", Exec) {
    group = "build"
    description = "Build raf_*_core binaries and copy them into assets/bin before packaging."
    workingDir rootDir
    commandLine "bash", "${rootDir}/termux-app/package_static_bins.sh"

    // Re-run when the helper sources or scripts change.
    inputs.files(
            fileTree(dir: rootDir, includes: [
                    "raf_cpu_core.c",
                    "raf_mem_core.c",
                    "raf_disk_core.c"
            ]),
            fileTree(dir: "${rootDir}/scripts", includes: [
                    "build_static.sh",
                    "raf_cpu_core.sh",
                    "raf_mem_core.sh",
                    "raf_disk_core.sh"
            ])
    )
    outputs.dir "${projectDir}/src/main/assets/bin"
}

preBuild.dependsOn packageStaticBins
