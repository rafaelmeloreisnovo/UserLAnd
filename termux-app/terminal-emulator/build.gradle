apply plugin: 'com.android.library'

def resolvedNdkVersion = rootProject.findProperty('ndkVersion') ?: '27.3.13750724'

android {
    namespace 'com.termux.terminal.emulator'
    compileSdk 34
    ndkVersion resolvedNdkVersion

    defaultConfig {
        minSdk 21
        targetSdk 34

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11",
                        "-Wall",
                        "-Wextra",
                        "-Werror",
                        "-Os",
                        "-fstack-protector-strong",
                        "-D_FORTIFY_SOURCE=2",
                        "-Wl,--gc-sections",
                        "-Wl,-z,relro",
                        "-Wl,-z,now"
            }
        }

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        beta {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
