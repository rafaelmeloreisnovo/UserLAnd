apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-kapt'

apply plugin: 'kotlin-parcelize'

apply plugin: 'androidx.navigation.safeargs.kotlin'

apply plugin: 'jacoco'

apply plugin: 'de.undercouch.download'

def defaultArchitectures = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
def requestedArchitectures = (project.findProperty('architectures')
        ?: project.findProperty('abis')
        ?: '')
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { it }
def supportedArchitectures = defaultArchitectures as Set
if (!requestedArchitectures.isEmpty()) {
    def unsupported = requestedArchitectures.findAll { !supportedArchitectures.contains(it) }
    if (!unsupported.isEmpty()) {
        throw new GradleException("Unsupported architectures requested: ${unsupported.join(', ')}")
    }
}
def architectures = requestedArchitectures.isEmpty() ? defaultArchitectures : requestedArchitectures

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def localNdkDir = localProperties.getProperty('ndk.dir')
        ?: System.getenv('ANDROID_NDK_HOME')
        ?: System.getenv('NDK_HOME')
def resolvedNdkVersion = project.findProperty('ndkVersion')
def abiFiltersProperty = project.findProperty('abiFilters') ?: project.findProperty('userlandAbiFilters')

android {
    namespace 'tech.ula'
    compileSdk 35
    if (resolvedNdkVersion && !localNdkDir) {
        ndkVersion resolvedNdkVersion
    }

    defaultConfig {
        // Version code is generated as time since June 1, 2019. These allows for constantly
        // sequential deployments to both production and beta tracks.
        def vcode = (int)(((new Date().getTime()/1000) - 1559347200) / 10)

        applicationId "tech.ula"
        minSdk 23
        targetSdk 35
        versionCode vcode
        versionName "2.8.3"

        if (abiFiltersProperty) {
            def abiFiltersList = abiFiltersProperty
                    .toString()
                    .split(',')
                    .collect { it.trim() }
                    .findAll { it }
            if (!abiFiltersList.isEmpty()) {
                ndk {
                    abiFilters(*abiFiltersList)
                }
            }
        }
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        vectorDrawables.useSupportLibrary = true
        buildConfigField 'boolean', 'ENABLE_PLAY_SERVICES', 'true'

        ndk {
            abiFilters(*architectures)
        }

        //these are used to help determine the resolution
        buildConfigField 'boolean', 'FORCE_PORTRAIT_GEOMETRY', 'true'
        buildConfigField 'int', "MAX_DIMENSION", "1280"
        buildConfigField 'int', "MIN_DIMENSION", "360"
        
        // Android 15 (API 35) specific optimizations
        buildConfigField 'boolean', 'ANDROID_15_OPTIMIZATIONS', 'true'
        
        // Device-specific optimizations for RMX3834 (Realme, Android 15, Kernel 5.15.178)
        // These flags enable specialized behavior for the target device
        buildConfigField 'String', 'TARGET_DEVICE_MODEL', '"RMX3834"'
        buildConfigField 'String', 'TARGET_KERNEL_VERSION', '"5.15.178-android13-8"'
        buildConfigField 'boolean', 'ENABLE_ARM64_OPTIMIZATIONS', 'true'
        buildConfigField 'boolean', 'ENABLE_SIMD_ACCELERATION', 'true'
        
        // Advanced debugging features for developer mode
        buildConfigField 'boolean', 'ENABLE_ADVANCED_DEBUGGING', 'true'
        buildConfigField 'boolean', 'ENABLE_PERFORMANCE_MONITORING', 'true'
        buildConfigField 'boolean', 'ENABLE_HARDWARE_DIAGNOSTICS', 'true'

        lint {
            lintConfig file("$projectDir/src/main/resources/lint.xml")
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        testOptions {
            execution 'ANDROIDX_TEST_ORCHESTRATOR'
        }
    }

    externalNativeBuild {
        cmake {
            path rootProject.file("core/librafaelia/CMakeLists.txt")
            version "3.22.1"
        }
    }

    def keystoreFile = project.file('../keystore.jks')
    def hasSigningCredentials = keystoreFile.exists() && [
            'ANDROID_KEY_ALIAS', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD'
    ].every { System.getenv(it) }
    def forceUnsigned = project.hasProperty('unsignedApk') && project.property('unsignedApk').toString() == 'true'
    def disableSigning = project.hasProperty('userlandUnsignedApk') || System.getenv('USERLAND_UNSIGNED_APK') == '1'

    signingConfigs {
        if (hasSigningCredentials) {
            beta {
                storeFile keystoreFile
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
            release {
                storeFile keystoreFile
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            testCoverageEnabled true
            buildConfigField 'boolean', 'ENABLE_PLAY_SERVICES', 'false'
        }
        beta {
            versionNameSuffix "-beta-$defaultConfig.versionCode"
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (hasSigningCredentials && !forceUnsigned && !disableSigning) {
                signingConfig signingConfigs.beta
            } else if (disableSigning || forceUnsigned) {
                signingConfig null
                println "Beta signing disabled; producing unsigned APK"
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (hasSigningCredentials && !forceUnsigned && !disableSigning) {
                signingConfig signingConfigs.release
            } else if (disableSigning || forceUnsigned) {
                signingConfig null
                println "Release signing disabled; producing unsigned APK"
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    // Enable this and run lintVitalRelease task to check missing translations.
    lint {
        disable 'MissingTranslation'
        disable 'ParcelCreator'
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                enabled = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            // Skip stripping for helper scripts packaged as faux-".so" binaries
            doNotStrip += ["**/lib_*.so"]
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

jacoco {
    toolVersion = "$jacoco_version"
}

configurations {
    ktlint
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
}

task reportVersionCode {
    def versionCodeFile = new File("$projectDir/versionCode.txt")
    def versionCode = project.android.defaultConfig.versionCode
    doLast {
        versionCodeFile.text = "$versionCode"
    }
}
// By running this task before builds, we guarantee that the same version is used for the fastlane
// to supply the automated changelogs.
preBuild.dependsOn reportVersionCode

task reportVersionName {
    def versionNameFile = new File("$projectDir/versionName.txt")
    def versionName = project.android.defaultConfig.versionName
    doLast {
        versionNameFile.text = "$versionName"
    }
}
preBuild.dependsOn reportVersionName

task ktlint(type: JavaExec, group: "verification") {
    description = "Check Kotlin code style."
    classpath = configurations.ktlint
    mainClass = "com.pinterest.ktlint.Main"
    args "--color", "src/main/**/*.kt"
}

task ktlintFormat(type: JavaExec, group: "formatting") {
    description = "Fix Kotlin code style deviations."
    classpath = configurations.ktlint
    mainClass = "com.pinterest.ktlint.Main"
    args "--color", "-F", "src/main/**/*.kt"
}

task testAll(dependsOn: ['test', 'connectedAndroidTest']) {
    description = "Run all unit and instrumented tests."
}

// This task is for generating coverage reports locally. It will run connected and unit tests if necessary.
task jacocoCoverageReport(type: JacocoReport, dependsOn: ['testDebugUnitTest', 'createDebugCoverageReport']) {

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [ '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*' ]
    def javaClasses = fileTree(dir: "$project.buildDir/intermediates/classes/debug", excludes: fileFilter)
    def kotlinClasses = fileTree(dir: "$project.buildDir/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "$project.projectDir/src/main/java"

    sourceDirectories.from = files(mainSrc)
    classDirectories.from = files([javaClasses, kotlinClasses])
    executionData.from = fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec', 'outputs/code-coverage/connected/*coverage.ec'
    ])
}

// This task is for generating coverage in CI. It will run unit tests if required but will only
// correctly report coverage if a 'coverage.ec' file has been moved into the workspace from Firebase.
task jacocoCoverageReportForCi(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [ '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*' ]
    def javaClasses = fileTree(dir: "$project.buildDir/intermediates/classes/debug", excludes: fileFilter)
    def kotlinClasses = fileTree(dir: "$project.buildDir/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "$project.projectDir/src/main/java"

    sourceDirectories.from = files(mainSrc)
    classDirectories.from = files([javaClasses, kotlinClasses])
    executionData.from = fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec', 'outputs/code-coverage/connected/*.ec'
    ])
}

ext.architectures = architectures
//ext.libDir = "$project.projectDir/src/main/resources/lib"
ext.libDir = "$project.projectDir/src/main/jniLibs"

// Capture variables for configuration cache compatibility
def capturedArchitectures = architectures
def capturedLibDir = ext.libDir
def capturedBuildDir = project.buildDir

task downloadAssets(type: Download) {
    def assetVersion = "v1.2.7"
    def baseUrl = "https://github.com/CypherpunkArmory/UserLAnd-Assets-Support/releases/download/$assetVersion"
    for (arch in capturedArchitectures) {
        src "$baseUrl/$arch-assets.zip"
        dest capturedBuildDir
    }
}

task fetchAssets(dependsOn: downloadAssets) {
    // Capture variables for configuration cache compatibility
    def localArchitectures = capturedArchitectures
    def localBuildDir = capturedBuildDir
    def localLibDir = capturedLibDir
    
    doLast {
        for (arch in localArchitectures) {
            def extractDir = new File(localBuildDir, arch)
            def targetDir = new File(localLibDir, arch)
            def zipFile = new File(localBuildDir, "$arch-assets.zip")
            
            // Clean previous directories completely
            extractDir.deleteDir()
            targetDir.deleteDir()
            targetDir.mkdirs()
            
            // Extract ZIP using Ant task
            ant.unzip(src: zipFile.absolutePath, dest: extractDir.absolutePath)
            
            // Copy and rename files using standard Java APIs
            extractDir.eachFileRecurse { file ->
                if (file.isFile() && !file.name.endsWith('.zip')) {
                    def baseName = file.name
                    def newName
                    if (baseName.startsWith('lib_')) {
                        newName = baseName
                    } else {
                        def dotIndex = baseName.lastIndexOf('.')
                        if (dotIndex == -1) {
                            newName = "lib_${baseName}"
                        } else {
                            def name = baseName.substring(0, dotIndex)
                            def extension = baseName.substring(dotIndex)
                            newName = "lib_${name}${extension}"
                        }
                    }
                    def destFile = new File(targetDir, newName)
                    destFile.bytes = file.bytes
                }
            }
            
            // Mark architecture
            new File(targetDir, "lib_arch.so").text = arch
        }
    }
}

task checkIfAssetsMissing {
    // Capture variables for configuration cache compatibility
    def localArchitectures = capturedArchitectures
    def localLibDir = capturedLibDir
    
    for (arch in localArchitectures) {
        File[] archLibDirContents = new File(localLibDir, arch).listFiles()
        if (archLibDirContents == null || archLibDirContents.length == 0) {
            dependsOn 'fetchAssets'
        }
    }
}

preBuild.dependsOn checkIfAssetsMissing

