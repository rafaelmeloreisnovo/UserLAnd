name: "Setup Android environment"
description: "Install Java, Android SDK, and NDK for consistent builds"

inputs:
  java-version:
    description: "Java version to install"
    default: "17"
  build-tools-version:
    description: "Android build tools version"
    default: "35.0.0"
  platform-version:
    description: "Android platform version (e.g. 34)"
    default: "35"
  ndk-version:
    description: "Android NDK version"
    default: "27.3.13750724"

runs:
  using: "composite"
  steps:
    - name: Clean up any problematic symlinks
      shell: bash
      run: |
        # Remove CodeQL-generated symlinks that cause ELOOP errors
        find . -maxdepth 1 -type l -name "_codeql*" -delete 2>/dev/null || true
        echo "✓ Cleaned up problematic symlinks"

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "${{ inputs.java-version }}"
        cache: gradle
        cache-dependency-path: |
          app/build.gradle
          app/build.gradle.kts
          build.gradle
          settings.gradle
          settings.gradle.kts
          gradle/wrapper/gradle-wrapper.properties

    - name: Install Android SDK and NDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # verified v3 commit
      with: {}

    - name: Install required SDK components
      shell: bash
      run: |
        set -euo pipefail
        echo "📦 Installing Android SDK components..."
        # CI-only: accept required Android SDK licenses non-interactively
        sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses < <(yes)
        echo "📥 Installing platform-tools, platforms, build-tools, and NDK..."
        sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
          "platform-tools" \
          "platforms;android-${{ inputs.platform-version }}" \
          "build-tools;${{ inputs.build-tools-version }}" \
          "ndk;${{ inputs.ndk-version }}"
        test -d "${ANDROID_SDK_ROOT}/platforms/android-${{ inputs.platform-version }}"
        test -d "${ANDROID_SDK_ROOT}/build-tools/${{ inputs.build-tools-version }}"
        test -x "${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
        echo "✓ SDK/NDK checked and installed successfully"

    - name: Configure NDK path
      shell: bash
      run: |
        echo "🔧 Configuring NDK paths..."
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}" >> "$GITHUB_ENV"
        printf "ndk.dir=%s/ndk/%s\n" "${ANDROID_SDK_ROOT}" "${{ inputs.ndk-version }}" >> local.properties
        echo "✓ NDK configured at ${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}"

    - name: Write Android toolchain summary
      shell: bash
      run: |
        {
          echo "## Android toolchain"
          echo ""
          echo "* Java: $(java -version 2>&1 | head -n 1)"
          echo "* SDK root: ${ANDROID_SDK_ROOT}"
          echo "* NDK: ${ANDROID_NDK_HOME:-${ANDROID_SDK_ROOT}/ndk/${{ inputs.ndk-version }}}"
          echo "* Platform: android-${{ inputs.platform-version }}"
          echo "* Build tools: ${{ inputs.build-tools-version }}"
        } >> "$GITHUB_STEP_SUMMARY"
