name: Build Android APKs (unsigned)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Fetch assets (retry up to 3x)
        run: |
          for attempt in {1..3}; do
            if ./gradlew --no-daemon :app:fetchAssets -PuserlandUnsignedApk=true; then
              break
            elif [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 5s..."
              sleep 5
            else
              echo "Attempt $attempt failed, giving up."
              exit 1
            fi
          done

      - name: Assemble Debug (unsigned)
        run: ./gradlew --no-daemon :app:assembleDebug -PuserlandUnsignedApk=true

      - name: Assemble Release (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease -PuserlandUnsignedApk=true

      - name: Show APK locations
        run: |
          ls -lh app/build/outputs/apk/debug || true
          ls -lh app/build/outputs/apk/release || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userland-unsigned-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
