name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Fetch Assets (with retry)
        run: |
          set +e
          RETRY_COUNT=0
          MAX_RETRIES=3
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT+1)) of $MAX_RETRIES: Fetching assets..."
            ./gradlew --no-daemon :app:fetchAssets && break
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Fetch failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
            echo "❌ Failed to fetch assets after $MAX_RETRIES attempts"
            exit 1
          fi
          
          echo "✅ Assets fetched successfully"

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug -PuserlandUnsignedApk=true

      - name: Build Release APK (Unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease -PuserlandUnsignedApk=true

      - name: Display APK Paths
        run: |
          echo "📦 Generated APKs:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UserLAnd-Debug-Unsigned
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UserLAnd-Release-Unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
