name: Download Bundle (One-Pass Manifest + Pack)

on:
  workflow_dispatch:
    inputs:
      chunk_size:
        description: 'Chunk size for file grouping (files per chunk)'
        required: false
        default: '50'
        type: string
      max_file_size_mb:
        description: 'Max individual file size to include (MB)'
        required: false
        default: '100'
        type: string
      include_patterns:
        description: 'Include patterns (space-separated globs, e.g. "*.kt *.java")'
        required: false
        default: ''
        type: string
      exclude_patterns:
        description: 'Exclude patterns (space-separated globs)'
        required: false
        default: ''
        type: string
      compression_level:
        description: 'Zip compression level (1=fast, 9=best)'
        required: false
        default: '6'
        type: string

permissions:
  contents: read

concurrency:
  group: download-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-download-bundle:
    name: Build Download Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: One-pass manifest and pack
        shell: bash
        env:
          CHUNK_SIZE: ${{ inputs.chunk_size }}
          MAX_FILE_SIZE_MB: ${{ inputs.max_file_size_mb }}
          INCLUDE_PATTERNS: ${{ inputs.include_patterns }}
          EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
          COMPRESSION_LEVEL: ${{ inputs.compression_level }}
        run: |
          set -euo pipefail
          python3 scripts/bundle_repo.py \
            --chunk-size "${CHUNK_SIZE:-50}" \
            --max-file-size-mb "${MAX_FILE_SIZE_MB:-100}" \
            --include-patterns "${INCLUDE_PATTERNS:-}" \
            --exclude-patterns "${EXCLUDE_PATTERNS:-}" \
            --compression-level "${COMPRESSION_LEVEL:-6}" \
            --output-dir dist/bundle

      - name: Summarize bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          summary="dist/bundle/MANIFEST.tsv"
          {
            echo "## Download Bundle artifacts"
            echo ""
            if [[ -f "$summary" ]]; then
              TOTAL_FILES=$(tail -n +2 "$summary" | wc -l)
              TOTAL_BYTES=$(tail -n +2 "$summary" | awk -F'\t' '{s+=$3} END {print s}')
              TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES/1048576" | bc)
              echo "- Total files: $TOTAL_FILES"
              echo "- Total size: ${TOTAL_MB} MB"
              echo ""
              echo '| Chunk | Path | Size (bytes) | SHA256 |'
              echo '|---:|---|---:|---|'
              tail -n +2 "$summary" | while IFS=$'\t' read -r chunk path size sha; do
                echo "| $chunk | $path | $size | \`$sha\` |"
              done
            else
              echo "No manifest generated. Build failed before artifact packaging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userland-download-bundle-${{ github.sha }}
          path: |
            dist/bundle/**/*.zip
            dist/bundle/MANIFEST.tsv
            dist/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90