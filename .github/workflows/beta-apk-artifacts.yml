name: Beta APK Artifacts Per ABI

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/tech/ula/betatester/**'
      - 'app/src/main/assets/betatester/**'
      - 'app/src/debug/AndroidManifest.xml'
      - 'app/src/beta/AndroidManifest.xml'
      - '.github/workflows/beta-apk-artifacts.yml'
  workflow_dispatch:
    inputs:
      signed_beta:
        description: "Build beta APKs with configured keystore secrets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beta-apk-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 27.3.13750724

jobs:
  build-beta-artifacts:
    name: Build beta/debug APKs (${{ matrix.abi.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - name: ARM64
            value: arm64-v8a
            suffix: arm64
          - name: ARM32
            value: armeabi-v7a
            suffix: arm32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-tools-version: "35.0.0"
          platform-version: "35"
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Restore keystore file when signed beta is requested
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.signed_beta }}" == "true" && -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          fi

      - name: Build and validate artifacts
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/build_apk.sh scripts/build_beta_artifacts.sh scripts/validate_apk.sh
          sign_mode="--unsigned"
          if [[ "${{ inputs.signed_beta }}" == "true" ]]; then
            sign_mode="--signed"
          fi
          scripts/build_beta_artifacts.sh \
            --abis "${{ matrix.abi.value }}" \
            "$sign_mode" \
            --skip-sdk \
            --dist "dist/beta-apks"

      - name: Summarize artifact sizes
        if: always()
        run: |
          set -euo pipefail
          summary="dist/beta-apks/SUMMARY.tsv"
          {
            echo "## ${{ matrix.abi.name }} beta/debug APK artifacts"
            echo ""
            if [[ -f "$summary" ]]; then
              echo '| Variant | ABI | Size bytes | SHA256 | Signing | Path |'
              echo '|---|---:|---:|---|---|---|'
              tail -n +2 "$summary" | while IFS=$'\t' read -r variant abi path size sha signing; do
                echo "| $variant | $abi | $size | \`$sha\` | $signing | $path |"
              done
            else
              echo "No summary generated. Build failed before artifact packaging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload individual APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: userland-${{ matrix.abi.suffix }}-debug-beta-apks-${{ github.sha }}
          path: |
            dist/beta-apks/${{ matrix.abi.suffix }}/**/*.apk
            dist/beta-apks/${{ matrix.abi.suffix }}/**/*.report
            dist/beta-apks/SUMMARY.tsv
            dist/beta-apks/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90