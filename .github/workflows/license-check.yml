name: License Check

on:
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'build.gradle'
      - 'scripts/license_audit.py'
      - '.github/workflows/license-check.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'app/build.gradle'
      - 'build.gradle'
      - 'scripts/license_audit.py'
      - '.github/workflows/license-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run license audit
        run: |
          python scripts/license_audit.py --fail-on-violation

      - name: Summarize license audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## License Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f license_audit_report.txt ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat license_audit_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated (script did not create license_audit_report.txt)." >> "$GITHUB_STEP_SUMMARY"
          fi
