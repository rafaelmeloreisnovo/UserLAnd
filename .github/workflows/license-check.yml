name: License Check

on:
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'build.gradle'
      - 'app/src/**'
      - '.github/workflows/license-check.yml'
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app/build.gradle'
      - 'build.gradle'
      - 'app/src/**'
      - '.github/workflows/license-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: Check OSS Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.2
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate OSS license report
        run: ./gradlew generateLicenseReport --no-daemon

      - name: Check for license violations
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="build/reports/licenses"
          
          if [[ ! -d "$REPORT_DIR" ]]; then
            echo "⚠️ License report not generated (task may not be configured)"
            exit 0
          fi
          
          # Check for any GPL or AGPL dependencies (not allowed in proprietary builds)
          VIOLATIONS=$(grep -r --include="*.json" -l '"license": "GPL"' "$REPORT_DIR" || true)
          if [[ -n "$VIOLATIONS" ]]; then
            echo "❌ License violations found:"
            echo "$VIOLATIONS"
            exit 1
          fi
          
          echo "✅ No license violations found"

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: build/reports/licenses/
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize license report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="build/reports/licenses"
          {
            echo "## License Check Report"
            if [[ -d "$REPORT_DIR" ]]; then
              REPORT_FILES=$(find "$REPORT_DIR" -name "*.json" | wc -l)
              echo "- Reports generated: $REPORT_FILES"
            else
              echo "- License report not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
