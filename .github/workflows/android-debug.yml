name: Android Debug (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble Debug + Tests (optional)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          # se quiser rodar testes:
          # ./gradlew test --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-manual-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
