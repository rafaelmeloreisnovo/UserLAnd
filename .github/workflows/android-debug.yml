name: Android Debug (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: "17"
          build-tools-version: "35.0.0"
          platform-version: "35"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4.2.2

      - name: Assemble Debug + Tests (optional)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          # se quiser rodar testes:
          # ./gradlew test --stacktrace

      - name: Summarize Debug APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Debug APK artifacts"
            for apk in app/build/outputs/apk/debug/*.apk; do
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | awk '{print $1}')
              echo "* $(basename "$apk") (${size})"
              echo "  - SHA256: \`${sha}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-manual-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7