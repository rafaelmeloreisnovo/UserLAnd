name: Android Release APK

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "8"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 26.1.10909125

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK and NDK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          printf "ndk.dir=%s/ndk/%s\n" "${ANDROID_SDK_ROOT}" "${NDK_VERSION}" > local.properties

      - name: Restore keystore file
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: userland-release-apk
          path: app/build/outputs/apk/release/app-release.apk
