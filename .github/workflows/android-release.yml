name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 27.3.13750724

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-tools-version: "35.0.0"
          platform-version: "35"
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Restore keystore file
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🔐 Restoring keystore file..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "✓ Keystore restored"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🔨 Building release APK..."
          ./gradlew assembleRelease --stacktrace --no-daemon
          echo "✓ APK built successfully"

      - name: Verify APK exists
        run: |
          echo "🔍 Verifying APK artifacts..."
          ls -lh app/build/outputs/apk/release/*.apk
          echo "✓ APK verification complete"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: userland-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-beta:
    name: Build beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-tools-version: "35.0.0"
          platform-version: "35"
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Restore keystore file
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🔐 Restoring keystore file..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "✓ Keystore restored"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build beta APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🔨 Building beta APK..."
          ./gradlew assembleBeta --stacktrace --no-daemon
          echo "✓ APK built successfully"

      - name: Verify APK exists
        run: |
          echo "🔍 Verifying APK artifacts..."
          ls -lh app/build/outputs/apk/beta/*.apk
          echo "✓ APK verification complete"

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: userland-beta-apk
          path: app/build/outputs/apk/beta/*.apk
          if-no-files-found: error
