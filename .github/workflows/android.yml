name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

# Evita duplicação e "dobro" (cancela o anterior no mesmo ref)
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "27.3.13750724"

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-tools-version: "35.0.0"
          platform-version: "35"
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create native asset stubs for CI
        shell: bash
        run: |
          set -euo pipefail
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p "app/src/main/jniLibs/$arch"
            printf '%s' "$arch" > "app/src/main/jniLibs/$arch/lib_arch.so"
          done
          echo "✓ Stub native assets created"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "🔨 Building debug APK..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          echo "✓ Debug APK built successfully"

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Verifying APK artifacts..."
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Summarize Debug APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Debug APK artifacts"
            for apk in app/build/outputs/apk/debug/*.apk; do
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | awk '{print $1}')
              echo "* $(basename "$apk") (${size})"
              echo "  - SHA256: \`${sha}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: userland-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-debug

    # Release só manual OU em tag v*
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: ${{ env.JAVA_VERSION }}
          build-tools-version: "35.0.0"
          platform-version: "35"
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create native asset stubs for CI
        shell: bash
        run: |
          set -euo pipefail
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p "app/src/main/jniLibs/$arch"
            printf '%s' "$arch" > "app/src/main/jniLibs/$arch/lib_arch.so"
          done
          echo "✓ Stub native assets created"

      - name: Restore keystore (if secret exists)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🔐 Restoring keystore file..."
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "✓ Keystore restored"

      - name: Build Release APK (signed if secrets exist)
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "🔨 Building release APK..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          echo "✓ Release APK built"

      - name: Verify Release APK exists
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Verifying release APK..."
          find app/build/outputs/apk/release -name "*.apk" -ls

      - name: Summarize Release APK
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "## Release APK artifacts"
            for apk in app/build/outputs/apk/release/*.apk; do
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | awk '{print $1}')
              echo "* $(basename "$apk") (${size})"
              echo "  - SHA256: \`${sha}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: userland-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
