name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  JAVA_VERSION: "17"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: "27.3.13750724"

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            app/build.gradle
            build.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install components
        run: |
          set -euo pipefail
          echo "📦 Installing Android SDK components..."
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "✓ SDK components installed"

      - name: Configure NDK path
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          printf "ndk.dir=%s/ndk/%s\n" "${ANDROID_SDK_ROOT}" "${{ env.NDK_VERSION }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          echo "🔨 Building debug APK..."
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          echo "✓ Debug APK built successfully"

      - name: Verify APK exists
        run: |
          echo "🔍 Verifying APK artifacts..."
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "✓ APK verification complete"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: userland-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            app/build.gradle
            build.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install components
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Configure NDK path
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          printf "ndk.dir=%s/ndk/%s\n" "${ANDROID_SDK_ROOT}" "${{ env.NDK_VERSION }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore keystore (if secrets exist)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "🔐 Restoring keystore file..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "✓ Keystore restored"

      - name: Build Release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          USERLAND_UNSIGNED_APK: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' && '1' || '' }}
        run: |
          echo "🔨 Building release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✓ Release APK built"

      - name: Verify Release APK exists
        run: |
          echo "🔍 Verifying release APK..."
          find app/build/outputs/apk/release -name "*.apk" -ls || echo "No release APK found"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: userland-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
