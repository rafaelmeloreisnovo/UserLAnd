name: UserLAnd Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  JAVA_VERSION: "8"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 26.1.10909125

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env

      - name: Install Android SDK and NDK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          printf "ndk.dir=%s/ndk/%s\n" "${ANDROID_SDK_ROOT}" "${NDK_VERSION}" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: userland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
