---
name: RAFAELIA Codex Route Check

'on':
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "README.md"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/rafaelia-codex-route.yml"
  pull_request:
    paths:
      - "README.md"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/rafaelia-codex-route.yml"

permissions:
  contents: read

concurrency:
  group: rafaelia-codex-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-check:
    name: RAFAELIA Codex Route Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Codex route check
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/rafaelia_codex_route.sh
          scripts/rafaelia_codex_route.sh

      - name: Report
        if: always()
        shell: bash
        run: |
          echo "## RAFAELIA Codex Route" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Codex route check completed." >> "$GITHUB_STEP_SUMMARY"
