---
name: RAFAELIA Codex Route Check

'on':
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "**.c"
      - "**.h"
      - "**.kt"
      - "**.java"
      - ".github/workflows/rafaelia-codex-route.yml"
  pull_request:
    paths:
      - "**.c"
      - "**.h"
      - "**.kt"
      - "**.java"
      - ".github/workflows/rafaelia-codex-route.yml"

permissions:
  contents: read

concurrency:
  group: rafaelia-codex-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-route:
    name: Codex Route Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔍 Validate source tree integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Validating source tree..."
          find . -name "*.kt" -o -name "*.java" | head -20
          echo "✅ Source tree validation complete"

      - name: 📊 Report
        shell: bash
        run: |
          echo "## 🔐 RAFAELIA Codex Route" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ΣΩΔΦ_{RAFAELIA} = ∑∑∑ [(C·A·Φ_{Ethica}) ⊗ Pre6seal ⊗ Firewall_Ω]" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Φ_ethica validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ψχρΔΣΩ_LOOP active" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Source integrity check passed" >> $GITHUB_STEP_SUMMARY
