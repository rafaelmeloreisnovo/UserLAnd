---
name: RAFAELIA Codex Route Check

'on':
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "README.md"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - "app/build.gradle"
      - "docs/**"
      - "scripts/**"
      - "core/librafaelia/**"
      - "raf_*.c"
      - ".github/workflows/rafaelia-codex-route.yml"
  pull_request:
    paths:
      - "README.md"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - "app/build.gradle"
      - "docs/**"
      - "scripts/**"
      - "core/librafaelia/**"
      - "raf_*.c"
      - ".github/workflows/rafaelia-codex-route.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafaelia-codex-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-check:
    name: Verify RAFAELIA/UserLAnd route invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run RAFAELIA Codex route checker
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/rafaelia_codex_route_check.sh
          scripts/rafaelia_codex_route_check.sh

      - name: Upload route report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rafaelia-codex-route-report
          path: build/rafaelia_codex_route/
          if-no-files-found: warn
          retention-days: 14
