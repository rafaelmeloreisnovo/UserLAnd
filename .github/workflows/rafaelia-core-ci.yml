name: RAFAELIA Core CI

on:
  push:
    branches: [ master ]
    paths:
      - "*.c"
      - "*.h"
      - "Makefile"
      - ".github/workflows/rafaelia-core-ci.yml"
  pull_request:
    paths:
      - "*.c"
      - "*.h"
      - "Makefile"
      - ".github/workflows/rafaelia-core-ci.yml"

permissions:
  contents: read

jobs:
  core-ci:
    name: Core CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc make

      - name: 🏗️ Build
        run: |
          if [ -f Makefile ]; then
            make all
          else
            echo "ℹ️ No Makefile found, skipping build"
          fi

      - name: 🧪 Test
        run: |
          if [ -f Makefile ]; then
            make test || echo "⚠️ Tests failed or not configured"
          else
            echo "ℹ️ No Makefile found, skipping tests"
          fi
