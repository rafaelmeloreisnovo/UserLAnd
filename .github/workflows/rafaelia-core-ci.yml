name: RAFAELIA Core CI

on:
  push:
    branches: [ master ]
    paths:
      - "*.c"
      - "*.h"
      - "scripts/**"
      - ".github/workflows/rafaelia-core-ci.yml"
  pull_request:
    paths:
      - "*.c"
      - "*.h"
      - "scripts/**"
      - ".github/workflows/rafaelia-core-ci.yml"

permissions:
  contents: read

jobs:
  core-ci:
    name: RAFAELIA Core Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build C sources
        run: |
          set -euo pipefail
          chmod +x scripts/build_core.sh
          scripts/build_core.sh

      - name: Run tests
        run: |
          set -euo pipefail
          chmod +x scripts/test_core.sh
          scripts/test_core.sh
