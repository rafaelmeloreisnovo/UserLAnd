name: RAFAELIA Core CI

on:
  push:
    branches: [ master ]
    paths:
      - "*.c"
      - "*.h"
      - "scripts/**"
      - ".github/workflows/rafaelia-core-ci.yml"
  pull_request:
    paths:
      - "raf_*"
      - "rafael_*"
      - "rafael*/**"
      - ".github/workflows/rafaelia-core-ci.yml"

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make

      - name: Build static RAFAELIA tools
        run: |
          chmod +x scripts/build_static.sh || true
          ./scripts/build_static.sh || true

      - name: Compile core C files (sanity)
        run: |
          CC=clang
          CFLAGS="-std=c11 -Wall -Wextra -Werror -O2"
          $CC $CFLAGS -c raf_cpu_core.c
          $CC $CFLAGS -c raf_dev_debug_perf.c
          $CC $CFLAGS -c raf_userland_debug.c
          $CC $CFLAGS -c rafael_userland_debug_runner.c
