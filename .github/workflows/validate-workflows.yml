name: 🔍 Validate Workflows

# Author: @rafaelmeloreisnovo
# RAFCODE-Φ Seal: ⟨Φ⟩-WORKFLOW-VALIDATOR-A

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 🔍 Validate workflow YAML files
        run: |
          python3 - <<'PYEOF'
          import yaml
          import sys
          from pathlib import Path

          errors = []
          workflow_dir = Path('.github/workflows')

          if not workflow_dir.exists():
              print("No workflows directory found")
              sys.exit(0)

          for wf_file in sorted(workflow_dir.glob('*.yml')):
              try:
                  with open(wf_file) as f:
                      data = yaml.safe_load(f)
                  if data is None:
                      errors.append(f"{wf_file}: Empty file")
                  elif not isinstance(data, dict):
                      errors.append(f"{wf_file}: Not a YAML mapping")
                  else:
                      print(f"✅ {wf_file.name}")
              except yaml.YAMLError as e:
                  errors.append(f"{wf_file}: YAML error: {e}")

          if errors:
              print("\n❌ Errors found:")
              for err in errors:
                  print(f"  - {err}")
              sys.exit(1)
          else:
              print("\n✅ All workflow files are valid YAML")
          PYEOF

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🔍 Workflow Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          WORKFLOW_COUNT=$(ls .github/workflows/*.yml 2>/dev/null | wc -l)
          echo "- Workflow files checked: $WORKFLOW_COUNT" >> $GITHUB_STEP_SUMMARY
