name: 🔍 Validate Workflows

# Author: @rafaelmeloreisnovo
# RAFCODE-Φ Seal: ⟨Φ⟩-WORKFLOW-VALIDATOR-ACTION-v1.0

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/check_workflows.py'
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'tools/check_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-action-refs:
    name: Validate Action References
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run workflow ref validator
        run: |
          python tools/check_workflows.py --strict

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          echo "## Workflow Reference Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked all .github/workflows/*.yml files for valid action references." >> "$GITHUB_STEP_SUMMARY"
