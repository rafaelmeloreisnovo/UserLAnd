name: CI Matrix

# RAFAELIA CI Matrix - Prototype/Draft
# Author: @rafaelmeloreisnovo
# RAFCODE-Φ seal: PROTOTYPE-DRAFT-v0.1.0
#
# Comprehensive CI testing matrix for multiple configurations.
# IMPORTANT: This is a prototype/draft. No automatic execution of infinite loops.
# Ethica[8] blocks prohibited executions.

on:
  push:
    branches:
      - master
      - 'rafaelia/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-test:
    name: Test (${{ matrix.os }}, Java ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java-version: ['17', '21']
        include:
          - os: ubuntu-latest
            java-version: '17'
            primary: true

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🐍 Set up Python (for validation tools)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 🔐 Run Ethica[8] checks
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Running Ethica[8] validation..."
          if [ -f tools/rafaelia_ethica_engine.py ]; then
            python tools/rafaelia_ethica_engine.py tools/check_workflows.py || true
          fi
          echo "✅ Ethica[8] check completed"

      - name: ☕ Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: 🔧 Setup Android SDK (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/setup-android-env
        with:
          java-version: ${{ matrix.java-version }}
          build-tools-version: "35.0.0"
          platform-version: "35"

      - name: 🏗️ Gradle cache
        uses: gradle/actions/setup-gradle@v4.2.2

      - name: 🔨 Build (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          echo "🏗️ Building debug APK..."
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          echo "✅ Build completed"

      - name: 🧪 Run tests (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.primary
        shell: bash
        run: |
          set -euo pipefail
          echo "🧪 Running unit tests..."
          ./gradlew test --stacktrace --no-daemon
          echo "✅ Tests completed"

      - name: 📊 Test Report
        if: matrix.os == 'ubuntu-latest' && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java-version }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: 📦 Upload APK (primary only)
        if: matrix.os == 'ubuntu-latest' && matrix.primary
        uses: actions/upload-artifact@v4
        with:
          name: ci-matrix-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 🔐 Validate workflows
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Validating workflow security..."
          python tools/check_workflows.py
          echo "✅ Workflow validation passed"

      - name: 📋 Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Generating SBOM..."
          chmod +x tools/generate_sbom.sh
          ./tools/generate_sbom.sh sbom-ci.json
          echo "✅ SBOM generated"

      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-ci-matrix
          path: sbom-ci.json
          if-no-files-found: warn
          retention-days: 30

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [matrix-test, security-checks]
    if: always()
    
    steps:
      - name: ✅ Check CI status
        shell: bash
        run: |
          echo "======================================================================"
          echo "CI Matrix Status"
          echo "======================================================================"
          echo "Matrix Tests: ${{ needs.matrix-test.result }}"
          echo "Security Checks: ${{ needs.security-checks.result }}"
          echo "======================================================================"
          
          if [ "${{ needs.matrix-test.result }}" == "failure" ] || [ "${{ needs.security-checks.result }}" == "failure" ]; then
            echo "❌ CI Matrix failed"
            exit 1
          fi
          
          echo "✅ CI Matrix passed"

