name: 🔨 CI Matrix

# Author: @rafaelmeloreisnovo
# RAFCODE-Φ Seal: ⟨Φ⟩-CI-MATRIX-v1.0
# Multi-language CI for C, Assembly, Kotlin, Java, Python, and Shell

on:
  pull_request:
    branches:
      - main
      - master
      - 'rafaelia/**'
  push:
    branches:
      - main
      - master
      - 'rafaelia/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # C Language Tests
  c-build:
    name: 🔧 C Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: shell-test
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 📦 Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
          
      - name: 🔨 Build C files
        run: |
          echo "🔍 Finding C files..."
          C_FILES=$(find . -maxdepth 1 -name "*.c" -type f | head -n 5)
          if [ -z "$C_FILES" ]; then
            echo "✓ No root-level C files to compile"
            exit 0
          fi
          
          echo "🔨 Compiling C files..."
          for file in $C_FILES; do
            echo "  - Compiling $file"
            gcc -c "$file" -o "${file%.c}.o" || echo "⚠️ Failed to compile $file"
          done
          
          echo "✓ C compilation check complete"
          
      - name: 🧪 Run C tests (if available)
        run: |
          if [ -d "tests" ] && [ -f "tests/Makefile" ]; then
            cd tests && make test-c || true
          else
            echo "ℹ️ No C test suite found"
          fi

  # Kotlin/Java Tests
  kotlin-java-build:
    name: ☕ Kotlin/Java Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: c-build
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: 🔨 Build with Gradle
        run: |
          echo "🔨 Building Android project..."
          ./gradlew assembleDebug --no-daemon --warning-mode=all
          
      - name: 🧪 Run Kotlin/Java tests
        run: |
          echo "🧪 Running unit tests..."
          ./gradlew testDebugUnitTest --no-daemon

  # Python Tests
  python-test:
    name: 🐍 Python Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: kotlin-java-build
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 pyyaml
          
          # Install dependencies from requirements.txt if it exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          
      - name: 🔍 Lint Python files
        run: |
          echo "🔍 Finding Python files..."
          PYTHON_FILES=$(find . -name "*.py" -type f | grep -v __pycache__ | head -n 10)
          
          if [ -z "$PYTHON_FILES" ]; then
            echo "✓ No Python files to lint"
            exit 0
          fi
          
          echo "🔍 Running flake8..."
          # W503 (line break before binary operator) is deprecated by PEP 8 and is extend-ignored
          flake8 $PYTHON_FILES --max-line-length=120 --extend-ignore=W503 || echo "⚠️ Linting found issues"
          
      - name: 🧪 Run Python tests (if available)
        run: |
          if [ -f "pytest.ini" ] || [ -d "tests" ]; then
            pip install pytest
            pytest -v || echo "⚠️ Some tests failed"
          else
            echo "ℹ️ No Python test suite found"
          fi

  # Shell Script Tests
  shell-test:
    name: 🐚 Shell Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 📦 Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
      - name: 🔍 Validate shell scripts
        run: |
          echo "🔍 Finding shell scripts..."
          SHELL_SCRIPTS=$(find . -name "*.sh" -type f | head -n 20)
          
          if [ -z "$SHELL_SCRIPTS" ]; then
            echo "✓ No shell scripts to validate"
            exit 0
          fi
          
          echo "🔍 Running shellcheck..."
          # SC2086: Double quote to prevent globbing and word splitting (tolerated for compatibility)
          # SC2181: Check exit code directly with e.g. 'if mycmd;', not indirectly with $? (style preference)
          ERROR_COUNT=0
          for script in $SHELL_SCRIPTS; do
            echo "  - Checking $script"
            if ! shellcheck "$script" -e SC2086,SC2181; then
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done
          
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "⚠️ Found issues in $ERROR_COUNT script(s)"
          else
            echo "✓ All shell scripts passed validation"
          fi
          
      - name: 🧪 Test shell scripts (basic syntax)
        run: |
          echo "🧪 Testing shell script syntax..."
          SHELL_SCRIPTS=$(find . -name "*.sh" -type f | head -n 20)
          
          for script in $SHELL_SCRIPTS; do
            echo "  - Syntax check: $script"
            bash -n "$script" || echo "⚠️ Syntax error in $script"
          done
          
          echo "✓ Syntax check complete"

  # Assembly (basic check)
  assembly-check:
    name: 🔩 Assembly Files Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: python-test
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: 🔍 Check for Assembly files
        run: |
          echo "🔍 Searching for Assembly files..."
          ASM_FILES=$(find . -name "*.s" -o -name "*.S" -o -name "*.asm" | head -n 10)
          
          if [ -z "$ASM_FILES" ]; then
            echo "ℹ️ No Assembly files found"
            exit 0
          fi
          
          echo "📋 Found Assembly files:"
          for file in $ASM_FILES; do
            echo "  - $file ($(wc -l < "$file") lines)"
          done
          
          echo "✓ Assembly file inventory complete"
          echo "ℹ️ Note: Assembly compilation requires specific toolchain setup"

  # Summary Job
  ci-summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [c-build, kotlin-java-build, python-test, shell-test, assembly-check]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🔨 CI Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| C Build & Test | ${{ needs.c-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kotlin/Java Build | ${{ needs.kotlin-java-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Lint & Test | ${{ needs.python-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shell Script Validation | ${{ needs.shell-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Assembly Files Check | ${{ needs.assembly-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Multi-language CI matrix complete" >> $GITHUB_STEP_SUMMARY
