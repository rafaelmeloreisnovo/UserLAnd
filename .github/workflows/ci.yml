name: CI Matrix
# Author: @rafaelmeloreisnovo
# RAFCODE-Φ: CI-MATRIX-v1.0
#
# Multi-language CI pipeline with matrix builds for:
# - C (gcc, clang)
# - Kotlin (kotlinc)
# - Java (javac, Gradle)
# - Python (3.9, 3.10, 3.11)
# - Shell (shellcheck)

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'rafaelia/**'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

jobs:
  detect-languages:
    name: 🔍 Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_c: ${{ steps.detect.outputs.has_c }}
      has_kotlin: ${{ steps.detect.outputs.has_kotlin }}
      has_java: ${{ steps.detect.outputs.has_java }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_shell: ${{ steps.detect.outputs.has_shell }}
    
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🔍 Detect languages
        id: detect
        run: |
          echo "has_c=$([ -n "$(find . -name '*.c' -o -name '*.h' | head -1)" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_kotlin=$([ -n "$(find . -name '*.kt' | head -1)" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_java=$([ -n "$(find . -name '*.java' | head -1)" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_python=$([ -n "$(find . -name '*.py' | head -1)" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_shell=$([ -n "$(find . -name '*.sh' | head -1)" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  c-build:
    name: 🔨 C Build (${{ matrix.compiler }})
    needs: detect-languages
    if: needs.detect-languages.outputs.has_c == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ${{ matrix.compiler }}
      
      - name: 🔨 Compile C files
        run: |
          echo "🔨 Compiling with ${{ matrix.compiler }}..."
          
          # Find and compile C files
          for c_file in $(find . -maxdepth 1 -name '*.c' -type f); do
            output="${c_file%.c}.out"
            echo "  Compiling: $c_file"
            ${{ matrix.compiler }} -Wall -Wextra -O2 "$c_file" -o "$output" || echo "  ⚠️  Compilation failed: $c_file"
          done
          
          echo "✓ C compilation completed"

  kotlin-build:
    name: 🔨 Kotlin Build
    needs: detect-languages
    if: needs.detect-languages.outputs.has_kotlin == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
      
      - name: ☕ Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 🔨 Gradle build
        run: |
          echo "🔨 Building with Gradle..."
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace || true
            echo "✓ Gradle build completed"
          else
            echo "⚠️  No gradlew found, skipping build"
          fi

  java-build:
    name: 🔨 Java Build (JDK ${{ matrix.java }})
    needs: detect-languages
    if: needs.detect-languages.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
      
      - name: ☕ Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      
      - name: 🔨 Compile Java files
        run: |
          echo "🔨 Compiling Java files with JDK ${{ matrix.java }}..."
          
          # Find and compile standalone Java files
          for java_file in $(find . -maxdepth 1 -name '*.java' -type f); do
            echo "  Compiling: $java_file"
            javac "$java_file" || echo "  ⚠️  Compilation failed: $java_file"
          done
          
          echo "✓ Java compilation completed"

  python-test:
    name: 🐍 Python (${{ matrix.python-version }})
    needs: detect-languages
    if: needs.detect-languages.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml psutil
          
          # Install dev dependencies if requirements exist
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
      
      - name: 🔍 Check Python syntax
        run: |
          echo "🔍 Checking Python syntax..."
          python -m py_compile tools/*.py 2>&1 || true
          echo "✓ Syntax check completed"
      
      - name: 🧪 Run Python tools
        run: |
          echo "🧪 Testing Python tools..."
          
          # Test check_workflows.py
          if [ -f tools/check_workflows.py ]; then
            python tools/check_workflows.py --help || true
          fi
          
          echo "✓ Python tools tested"

  shell-check:
    name: 🐚 Shell Check
    needs: detect-languages
    if: needs.detect-languages.outputs.has_shell == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      
      - name: 🔍 Run shellcheck
        run: |
          echo "🔍 Running shellcheck..."
          
          # Find and check shell scripts
          find . -name '*.sh' -type f | while read -r script; do
            echo "  Checking: $script"
            shellcheck "$script" || echo "  ⚠️  Issues found in: $script"
          done
          
          echo "✓ Shellcheck completed"

  summary:
    name: 📊 CI Summary
    needs: [detect-languages, c-build, kotlin-build, java-build, python-test, shell-check]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: 📊 Display summary
        run: |
          echo "## CI Matrix Results"
          echo ""
          echo "Languages detected:"
          echo "  C: ${{ needs.detect-languages.outputs.has_c }}"
          echo "  Kotlin: ${{ needs.detect-languages.outputs.has_kotlin }}"
          echo "  Java: ${{ needs.detect-languages.outputs.has_java }}"
          echo "  Python: ${{ needs.detect-languages.outputs.has_python }}"
          echo "  Shell: ${{ needs.detect-languages.outputs.has_shell }}"
          echo ""
          echo "Build results:"
          echo "  C: ${{ needs.c-build.result }}"
          echo "  Kotlin: ${{ needs.kotlin-build.result }}"
          echo "  Java: ${{ needs.java-build.result }}"
          echo "  Python: ${{ needs.python-test.result }}"
          echo "  Shell: ${{ needs.shell-check.result }}"
