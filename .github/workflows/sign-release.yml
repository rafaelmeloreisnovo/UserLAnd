name: Sign & Release APK — UserLAnd

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release from the signed APK
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # UserLAnd reads keystore from ../keystore.jks (relative to app/).
      # Decoded to $GITHUB_WORKSPACE/keystore.jks which resolves correctly.
      - name: Decode release keystore
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew app:assembleRelease

      - name: Upload signed APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: userland-signed-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
