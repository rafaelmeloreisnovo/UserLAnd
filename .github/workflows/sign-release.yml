name: Sign & Release APK — UserLAnd

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release from the signed APK
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sign-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-and-release:
    name: Sign & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Android SDK and NDK
        uses: ./.github/actions/setup-android-env
        with:
          java-version: "17"
          build-tools-version: "35.0.0"
          platform-version: "35"

      - name: Restore keystore file
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is not set." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "Keystore restored."

      - name: Create native asset stubs
        shell: bash
        run: |
          set -euo pipefail
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p "app/src/main/jniLibs/$arch"
            printf '%s' "$arch" > "app/src/main/jniLibs/$arch/lib_arch.so"
          done

      - name: Build release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [[ -f "$APK" ]] || { echo "No APK found" >&2; exit 1; }
          echo "Signed APK: $APK"
          ls -lh "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: userland-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.create_release == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
