name: Compilation Guarantee Check

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/compilation-guarantee.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/compilation-guarantee.yml"

permissions:
  contents: read

concurrency:
  group: compilation-guarantee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-compilation:
    name: Verify Compilation Requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔍 Run compilation guarantee checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/ensure_compilation.sh
          ./scripts/ensure_compilation.sh

      - name: 📊 Generate build report
        if: always()
        shell: bash
        run: |
          echo "## 📋 Compilation Guarantee Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: $(java -version 2>&1 | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle**: $(./gradlew --version | grep "^Gradle" | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: $(uname -s) $(uname -m)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f /tmp/gradle_deps.log ]]; then
            echo "### 📦 Dependencies" >> $GITHUB_STEP_SUMMARY
            echo "Dependencies resolved successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 🎯 Status" >> $GITHUB_STEP_SUMMARY
          echo "All compilation requirements verified ✓" >> $GITHUB_STEP_SUMMARY

  test-compilation:
    name: Test Full Compilation
    runs-on: ubuntu-latest
    needs: verify-compilation
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🏗️ Run full compilation test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/ensure_compilation.sh
          RUN_COMPILATION_TEST=true ./scripts/ensure_compilation.sh

      - name: 📦 Verify APK was generated
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/build/outputs/apk/debug/app-debug.apk ]]; then
            echo "✅ APK generated successfully"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            echo ""
            echo "📊 APK Size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          else
            echo "❌ APK was not generated"
            exit 1
          fi

      - name: 📊 Generate compilation report
        if: always()
        shell: bash
        run: |
          echo "## 🏗️ Compilation Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f app/build/outputs/apk/debug/app-debug.apk ]]; then
            APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "### ✅ Compilation Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Size**: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Path**: app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📝 Build Logs" >> $GITHUB_STEP_SUMMARY
            if [[ -f /tmp/gradle_build.log ]]; then
              echo "Build completed successfully. Check workflow logs for details." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ❌ Compilation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the build logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
