# CI workflow: build dev, run selftest, run python proof (golden vectors + bitflip)
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install blake3 reedsolo || true
      - name: Build dev binaries
        run: make dev
      - name: Run selftest
        run: ./ziprafa_cli selftest || true
      - name: Generate golden vectors
        run: python3 generate_golden_vectors.py --outdir golden_vectors
      - name: Run proof harness
        run: python3 bitflip_recover.py --dir golden_vectors --out proof_report.json || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-report
          path: proof_report.json