// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        // Use secure Maven Central URL to avoid 403 Forbidden errors
        maven { url "https://repo1.maven.org/maven2/" }
    }

    ext {
        // Kotlin 1.9.24 for compatibility with AGP 8.6.0 and AndroidX baselines
        kotlin_version = '1.9.24'
        android_plugin = '8.6.0'
        jacoco_version = '0.8.14'
        // Navigation 2.9.6 compatible with AGP 8.6.0 and Kotlin 1.9.24
        navigation_version = '2.9.6'
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
        classpath "org.jacoco:org.jacoco.core:$jacoco_version"
        classpath 'de.undercouch:gradle-download-task:5.6.0'
    }
}

ext {
    androidx_core_version = '1.17.0'
    androidx_annotation_version = '1.9.1'
    androidx_room_version = '2.8.4'
    androidx_lifecycle_version = '2.10.0'
    androidx_constraintlayout_version = '2.2.1'
    androidx_preference_version = '1.2.1'
    androidx_swiperefreshlayout_version = '1.2.0'
    androidx_localbroadcastmanager_version = '1.1.0'
    androidx_drawerlayout_version = '1.2.0'
    androidx_viewpager_version = '1.1.0'
    androidx_test_version = '1.6.1'
    androidx_test_ext_version = '1.3.0'
    androidx_test_espresso_version = '3.7.0'
    material_version = '1.13.0'
    kotlinx_coroutines_version = '1.8.1'
    okhttp_version = '4.12.0'
    moshi_version = '1.15.2'
    gson_version = '2.11.0'
    jarchivelib_version = '1.2.0'
    sentry_version = '8.29.0'
    slf4j_version = '2.0.9'
    billing_version = '7.1.1'
    play_services_base_version = '18.9.0'
    ktlint_version = '1.5.0'
    mockito_version = '5.2.0'
    mockito_kotlin_version = '6.1.0'
    core_testing_version = '2.2.0'
}

allprojects {
    repositories {
        google()
        // Use secure Maven Central URL to avoid 403 Forbidden errors
        maven { url "https://repo1.maven.org/maven2/" }
        maven { url "https://jitpack.io" }
        // RmR (Rafael Melo Reis) androidx enhancements
        maven { 
            url "https://github.com/rafaelmeloreisnovo/androidx_RmR"
            // For local development, you can use a local path:
            // url "/path/to/local/androidx_RmR"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
