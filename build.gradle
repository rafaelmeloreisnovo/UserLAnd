// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    ext {
        // Downgrade Kotlin to 2.0.21 for compatibility with Room 2.6.1
        // Kotlin 2.3.0 generates metadata version 2.3.0, while Room 2.6.1 only supports up to 2.0.0
        kotlin_version = '2.0.21'
        android_plugin = '8.6.0'
        jacoco_version = '0.8.14'
        // Downgrade navigation to 2.7.7 for compatibility with AGP 8.6.0 and compileSdk 35
        // Navigation 2.9.6 requires core:1.17.0 which needs AGP 8.9.1+ and compileSdk 36
        navigation_version = '2.9.6'
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
        classpath "org.jacoco:org.jacoco.core:$jacoco_version"
        classpath 'de.undercouch:gradle-download-task:5.6.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // RmR (Rafael Melo Reis) androidx enhancements
        maven { 
            url "https://github.com/rafaelmeloreisnovo/androidx_RmR"
            // For local development, you can use a local path:
            // url "/path/to/local/androidx_RmR"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
