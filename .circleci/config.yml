version: 2.1

references:
  # Cache
  cache_key: &cache_key
    key: cache-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}

  restore_cache: &restore_cache
    restore_cache:
      <<: *cache_key

  save_cache: &save_cache
    save_cache:
      <<: *cache_key
      paths:
        - ~/.gradle
        - ~/.m2

  # Basic docker config
  android_config: &android_config
    working_directory: ~/workspace
    docker:
      - image: circleci/android@sha256:fa7a00c75f4b28cc4f2a15a382fb76e830d62a77efd1a3f8549f7f5fdad4ca44
    environment:
      TERM: dumb
      _JAVA_OPTIONS: "-Xmx2048m -XX:+UnlockExperimentalVMOptions -XX:+UseCGroupMemoryLimitForHeap -XX:MaxRAMFraction=1"
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2048m"'
      ANDROID_SDK_ROOT: /opt/android/sdk

  # Dependencies
  android_dependencies: &android_dependencies
    run:
      name: Download Android dependencies
      command: ./gradlew androidDependencies

  configure_ndk: &configure_ndk
    run:
      name: Install Android SDK and NDK
      command: |
        export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
        yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
        printf "ndk.dir=%s/ndk/26.1.10909125\n" "${ANDROID_SDK_ROOT}" > local.properties

jobs:
  build_debug:
    <<: *android_config
    steps:
      - checkout
      - *restore_cache
      - *android_dependencies
      - *configure_ndk
      - *save_cache

      - run:
          name: Run ktlint
          command: ./gradlew ktlint

      - run:
          name: Build debug
          command: ./gradlew -PciBuild=true :app:assembleDebug :app:assembleAndroidTest

      - store_artifacts:
          path: app/build/outputs/apk/
          destination: apk

  test_unit:
    <<: *android_config
    steps:
      - checkout
      - *restore_cache
      - *android_dependencies
      - *configure_ndk
      - *save_cache

      - run:
          name: Run unit tests
          command: ./gradlew -PciBuild=true :app:testDebugUnitTest

      - store_artifacts:
          path: app/build/reports/
          destination: reports

      - store_test_results:
          path: app/build/test-results/
          destination: test-results

workflows:
  version: 2
  workflow:
    jobs:
      - build_debug
      - test_unit:
          requires:
            - build_debug
