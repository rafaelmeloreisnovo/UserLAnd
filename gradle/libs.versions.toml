[versions]
# Build tools and plugins
kotlin = "2.1.0"
androidGradlePlugin = "8.7.3"
jacoco = "0.8.12"

# AndroidX libraries
androidx-core-ktx = "1.17.0"
androidx-room = "2.8.5"
androidx-lifecycle = "2.10.1"
androidx-navigation = "2.9.6"
androidx-constraintlayout = "2.2.1"
androidx-preference = "1.2.1"
androidx-swiperefreshlayout = "1.2.0"
androidx-test = "1.6.1"
androidx-test-ext = "1.3.0"
androidx-test-espresso = "3.7.0"

# Material Design
material = "1.13.0"

# Kotlin libraries
kotlinx-coroutines = "1.10.3"

# Network and serialization
okhttp = "4.12.0"
moshi = "1.15.2"
gson = "2.11.0"

# Utilities
jarchivelib = "0.8.0"
sentry = "7.20.1"
slf4j = "2.0.16"

# Google Play Services
billing = "8.3.0"
play-services-base = "18.5.0"

# Code quality
ktlint-cli = "1.5.0"
gradle-download-task = "5.6.0"

# Testing
junit = "4.13.2"
mockito = "5.15.2"
mockito-kotlin = "5.4.0"
barista = "4.3.0"
core-testing = "2.2.0"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidx-room" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation" }
androidx-navigation-safe-args = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "androidx-navigation" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }

# Material Design
material = { module = "com.google.android.material:material", version.ref = "material" }

# Kotlin
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Network and serialization
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Utilities
jarchivelib = { module = "org.rauschig:jarchivelib", version.ref = "jarchivelib" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

# Google Play Services
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
play-services-base = { module = "com.google.android.gms:play-services-base", version.ref = "play-services-base" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "androidx-test-espresso" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "core-testing" }
barista = { module = "com.github.SchibstedSpain:Barista", version.ref = "barista" }

# Plugins
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jacoco-core = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }
gradle-download-task = { module = "de.undercouch:gradle-download-task", version.ref = "gradle-download-task" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint-cli" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
navigation-safe-args-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "androidx-navigation" }

[bundles]
androidx-lifecycle = ["androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-livedata-ktx"]
androidx-navigation = ["androidx-navigation-fragment-ktx", "androidx-navigation-ui-ktx"]
kotlinx-coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
testing = ["junit", "mockito-core", "mockito-inline", "mockito-kotlin", "androidx-arch-core-testing"]
android-testing = ["androidx-test-runner", "androidx-test-rules", "androidx-test-ext-junit", "androidx-test-espresso-intents", "androidx-arch-core-testing"]
